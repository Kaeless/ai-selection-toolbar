name: Publish v0.1 and v0.2

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v0.1-v0.2.yml]

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified Windows installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 36207152928 -R "$GITHUB_REPOSITORY" -n windows-x64-packages -D packages/v01
          gh run download 36210061018 -R "$GITHUB_REPOSITORY" -n AISelectionToolbar-0.2.0-win-x64-setup -D packages/v02
          echo '27ca6307228fdc515d29089b6a6346becb7f960ea745b63813458faf0252946e  packages/v01/AISelectionToolbar-0.1.0-win-x64-setup.exe' | sha256sum -c -
          echo '08ebd51107febc0b6b422337340d93b0dfc6c46e8e7a6a348c92e206f4341670  packages/v02/AISelectionToolbar-0.2.0-win-x64-setup.exe' | sha256sum -c -
      - name: Publish v0.1.0 installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.0 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf '%s\n' '# v0.1.0' '' \
              '- Windows x64 划词浮窗：解释、翻译、提问及流式结果。' \
              '- 托盘常驻、本机管理页、SQLite 历史和 Markdown 笔记。' \
              '- OpenAI 兼容 API 设置、DPAPI 密钥保护与程序排除。' '' \
              '安装前需 .NET Framework 4.8；Windows 7/11 的目标程序交互仍需实机验收。' > v01-notes.md
            gh release create v0.1.0 packages/v01/AISelectionToolbar-0.1.0-win-x64-setup.exe \
              -R "$GITHUB_REPOSITORY" --target b34196d18545ff89afde99f650056cb7040e336a \
              --title 'v0.1.0' --notes-file v01-notes.md
          fi
      - name: Publish v0.2.0 installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.2.0 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v0.2.0 packages/v02/AISelectionToolbar-0.2.0-win-x64-setup.exe \
              -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'v0.2.0' --notes-file docs/RELEASE_NOTES_v0.2.md
          fi
