name: Linux build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt, X11 and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-6 libxcb-cursor0 xclip xvfb xauth
          python -m pip install --upgrade pip
          python -m pip install -e '.[build]'
      - name: Run Linux unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest tests/test_linux_settings.py tests/test_linux_position.py tests/test_linux_history.py
      - name: Build portable PySide6 executable
        run: |
          pyinstaller --noconfirm --clean --onefile --name AiSelectionToolbar.Linux \
            --paths src/Linux --collect-all keyring \
            --add-data 'src/Desktop/ManagementPage.html:web' \
            --add-data 'src/Desktop/ManagementPage.css:web' \
            --add-data 'src/Desktop/ManagementPage.js:web' \
            --add-data 'src/Desktop/Assets/AppIcon.svg:.' \
            src/Linux/launcher.py
          mkdir -p dist/linux-x64
          mv dist/AiSelectionToolbar.Linux dist/linux-x64/
      - name: Check startup guard without X11
        run: |
          set +e
          env -u DISPLAY -u WAYLAND_DISPLAY dist/linux-x64/AiSelectionToolbar.Linux > /tmp/linux-startup.out 2>&1
          result=$?
          cat /tmp/linux-startup.out
          test "$result" -eq 2
      - name: Smoke test PySide6 startup under Xvfb
        run: |
          set +e
          timeout 8s xvfb-run -a env XDG_SESSION_TYPE=x11 dist/linux-x64/AiSelectionToolbar.Linux > /tmp/linux-gtk.out 2>&1
          result=$?
          cat /tmp/linux-gtk.out
          test "$result" -eq 124
      - name: Package artifact
        run: |
          cp src/Desktop/Assets/AppIcon.svg dist/linux-x64/AppIcon.svg
          cp packaging/linux/install.sh packaging/linux/uninstall.sh dist/linux-x64/
          chmod +x dist/linux-x64/install.sh dist/linux-x64/uninstall.sh
          tar -C dist/linux-x64 -czf dist/AISelectionToolbar-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: AISelectionToolbar-linux-x64
          path: dist/AISelectionToolbar-linux-x64.tar.gz
          if-no-files-found: error
