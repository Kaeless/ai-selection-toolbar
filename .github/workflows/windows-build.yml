name: Windows build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - name: Restore and build WPF application
        run: msbuild src\Desktop\AiSelectionToolbar.Desktop.csproj /t:Restore,Build /p:Configuration=Release /p:Platform=AnyCPU /verbosity:minimal
      - name: Package portable build
        shell: pwsh
        run: |
          $release = Resolve-Path 'src/Desktop/bin/Release'
          $package = Join-Path $env:USERPROFILE '.nuget/packages/stub.system.data.sqlite.core.netframework/1.0.119'
          if (!(Test-Path $package)) { throw 'SQLite NuGet package missing after restore' }
          $native = @(Get-ChildItem $package -Filter SQLite.Interop.dll -Recurse -File |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' })
          $native = @($native | Where-Object { $_.FullName -match 'net46' })
          if ($native.Count -ne 1) { throw "Expected one net46 SQLite x64 library; candidates: $($native.FullName -join ', ')" }
          New-Item -ItemType Directory -Path "$release/x64" -Force | Out-Null
          Copy-Item $native[0].FullName "$release/x64/SQLite.Interop.dll" -Force
          if (!(Test-Path "$release/x64/SQLite.Interop.dll")) { throw 'SQLite x64 native library missing' }
          if (!(Test-Path "$release/System.Data.SQLite.dll")) { throw 'SQLite managed library missing' }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path "$release/*" -DestinationPath 'dist/AISelectionToolbar-0.3.2-win-x64-portable.zip' -Force
      - name: Package installer
        shell: pwsh
        run: |
          $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $compiler = if ($command) { $command.Source } else { 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' }
          if (!(Test-Path $compiler)) { throw 'Inno Setup compiler missing from Windows runner' }
          & $compiler 'installer/AiSelectionToolbar.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test portable and installer packages
        shell: pwsh
        run: ./tests/windows-package-smoke.ps1
      - name: Smoke test reasoning and answer stream
        shell: pwsh
        run: |
          $release = (Resolve-Path 'src/Desktop/bin/Release').Path
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $compiler /nologo /target:exe /out:"$release/ChatStreamSmoke.exe" `
            /reference:"$release/AiSelectionToolbar.Desktop.exe" /reference:System.Net.Http.dll `
            tests/ChatStreamSmoke.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$release/ChatStreamSmoke.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item "$release/ChatStreamSmoke.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-packages
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AISelectionToolbar-0.3.2-win-x64-setup
          path: dist/AISelectionToolbar-0.3.2-win-x64-setup.exe
          if-no-files-found: error
