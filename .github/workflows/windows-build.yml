name: Windows build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - name: Restore and build WPF application
        run: msbuild src\Desktop\AiSelectionToolbar.Desktop.csproj /t:Restore,Build /p:Configuration=Release /p:Platform=AnyCPU /verbosity:minimal
      - name: Package portable build
        shell: pwsh
        run: |
          $release = Resolve-Path 'src/Desktop/bin/Release'
          $package = Join-Path $env:USERPROFILE '.nuget/packages/stub.system.data.sqlite.core.netframework/1.0.119'
          if (!(Test-Path $package)) { throw 'SQLite NuGet package missing after restore' }
          $native = @(Get-ChildItem $package -Filter SQLite.Interop.dll -Recurse -File |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' })
          $native = @($native | Where-Object { $_.FullName -match 'net46' })
          if ($native.Count -ne 1) { throw "Expected one net46 SQLite x64 library; candidates: $($native.FullName -join ', ')" }
          New-Item -ItemType Directory -Path "$release/x64" -Force | Out-Null
          Copy-Item $native[0].FullName "$release/x64/SQLite.Interop.dll" -Force
          if (!(Test-Path "$release/x64/SQLite.Interop.dll")) { throw 'SQLite x64 native library missing' }
          if (!(Test-Path "$release/System.Data.SQLite.dll")) { throw 'SQLite managed library missing' }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path "$release/*" -DestinationPath 'dist/AISelectionToolbar-0.5.3-win-x64-portable.zip' -Force
      - name: Package installer
        shell: pwsh
        run: |
          $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $compiler = if ($command) { $command.Source } else { 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' }
          if (!(Test-Path $compiler)) { throw 'Inno Setup compiler missing from Windows runner' }
          & $compiler 'installer/AiSelectionToolbar.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test portable and installer packages
        shell: pwsh
        run: ./tests/windows-package-smoke.ps1
      - name: Smoke test reasoning and answer stream
        shell: pwsh
        run: |
          $release = (Resolve-Path 'src/Desktop/bin/Release').Path
          $source = (Resolve-Path 'tests/ChatStreamSmoke.cs').Path
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $compiler /nologo /target:exe /out:"$release/ChatStreamSmoke.exe" `
            /reference:"$release/AiSelectionToolbar.Desktop.exe" /reference:System.Net.Http.dll `
            "$source"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$release/ChatStreamSmoke.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item "$release/ChatStreamSmoke.exe"
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install chromium
      - name: Windows desktop and management UI regression tests
        shell: pwsh
        run: |
          $release = (Resolve-Path 'src/Desktop/bin/Release').Path
          $out = Join-Path $env:GITHUB_WORKSPACE 'test-results'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $fw = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319'
          $wpf = Join-Path $fw 'WPF'
          & "$fw/csc.exe" /nologo /target:exe /out:"$release/WindowsUiSmoke.exe" /reference:"$release/AiSelectionToolbar.Desktop.exe" /reference:"$wpf/PresentationFramework.dll" /reference:"$wpf/PresentationCore.dll" /reference:"$wpf/WindowsBase.dll" /reference:System.Xaml.dll /reference:System.Web.Extensions.dll tests/WindowsUiSmoke.cs
          if ($LASTEXITCODE -ne 0) { throw 'UI harness compilation failed' }
          $desktop = Start-Process "$release/WindowsUiSmoke.exe" -ArgumentList "`"$out`"" -PassThru
          try {
            for ($i = 0; $i -lt 120; $i++) {
              if ($desktop.HasExited) { throw "Desktop test exited: $($desktop.ExitCode)" }
              if (Test-Path "$out/management-url.txt") { break }
              Start-Sleep -Milliseconds 500
            }
            if (!(Test-Path "$out/management-url.txt")) { throw 'Desktop test did not publish management URL' }
            node tests/windows-management-smoke.cjs $out
            $browserExit = $LASTEXITCODE
            if (!$desktop.WaitForExit(20000)) { throw 'Desktop test did not exit' }
            if ($browserExit -ne 0 -or $desktop.ExitCode -ne 0) { throw 'UI regression tests failed' }
          } finally {
            if (!$desktop.HasExited) { Stop-Process -Id $desktop.Id -Force }
            Remove-Item "$out/management-url.txt" -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-v0.5.3-test-evidence
          path: test-results/*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-packages
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AISelectionToolbar-0.5.3-win-x64-setup
          path: dist/AISelectionToolbar-0.5.3-win-x64-setup.exe
          if-no-files-found: error
