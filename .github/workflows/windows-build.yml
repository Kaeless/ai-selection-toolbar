name: Windows build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - name: Restore and build WPF application
        run: msbuild src\Desktop\AiSelectionToolbar.Desktop.csproj /t:Restore,Build /p:Configuration=Release /p:Platform=AnyCPU /verbosity:minimal
